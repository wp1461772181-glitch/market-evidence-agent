[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-evidence-agent"
version = "0.1.0"
description = "Market evidence API with traceable historical market-data snapshots"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars>=4.11,<5.0",
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "openai>=1.68,<2.0",
  "pandas>=2.2,<3.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.7,<1.8",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
