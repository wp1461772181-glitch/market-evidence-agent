- id: csrc-announcements
  name: 中国证监会官网信息公开
  enabled: true
  kind: http_html
  url: http://www.csrc.gov.cn/csrc/c106311/common_list.shtml
  homepage: http://www.csrc.gov.cn/
  language: zh-CN
  tags:
  - csrc
  - regulation
  - a-shares
  markets:
  - CN
  fetch:
    timeout_seconds: 20
    href_regex: /csrc/c\d+/c[0-9a-zA-Z]+/content\.shtml
