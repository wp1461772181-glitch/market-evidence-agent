watchlists:
- id: default
  tickers:
  - NVDA
  - AAPL
  - MSFT
  - '600519'
  keywords:
  - 降息
  - 非农
  - 财报
  - 指引
  push_on_match: true
push:
  enabled: true
  channel: finbot_notify
  summary_max_tokens: 256
  max_items_per_digest: 8
  digest_cron: '*/30 * * * *'
  actions_required:
  - confirm_inline: true
  - open_chat_fallback: true
