<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" role="img" aria-label="FinBot">
  <title>FinBot</title>
  <g transform="translate(8, -14) scale(0.82)">
              <!-- Soft Shadow -->
              <ellipse cx="102" cy="184" rx="48" ry="6" fill="#000000" opacity="0.22" />

              <!-- Little Eureka Sparkle at Top Right -->
              <path d="M 164 26 Q 164 38 176 38 Q 164 38 164 50 Q 164 38 152 38 Q 164 38 164 26 Z" fill="#fbbf24" />

              <!-- Head Tilted -7 deg for Curious Expression -->
              <g transform="rotate(-7 100 84)">
                <!-- Pure Smooth Dome -->
                <rect x="34" y="22" width="132" height="114" rx="56" fill="#18181b" stroke="#27272a" stroke-width="3" />
                <!-- Subtle Rim Highlight on Top Left -->
                <path d="M 62 28 Q 96 22 128 27" fill="none" stroke="#3f3f46" stroke-width="2" stroke-linecap="round" />

                <!-- Visor Shifted Slightly Right/Down (3D Depth) -->
                <rect x="48" y="38" width="106" height="78" rx="38" fill="#09090b" />

                <!-- Left Eye: Playful Focused Squint (Smaller + Curved Top) -->
                <g transform="translate(76, 80)">
                  <rect x="-7.5" y="-9" width="15" height="19" rx="7.5" fill="#fbbf24" />
                  <circle cx="-1.5" cy="2" r="2.2" fill="#ffffff" />
                  <!-- Curious Little Brow -->
                  <path d="M -9 -14 Q 0 -17 8 -13" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
                </g>

                <!-- Right Eye: Magnified by the Monocle (Bigger & Rounder!) -->
                <g transform="translate(124, 78)">
                  <rect x="-10" y="-14" width="20" height="28" rx="10" fill="#fbbf24" />
                  <circle cx="-2.5" cy="3" r="3.2" fill="#ffffff" />
                  <circle cx="4" cy="-5" r="1.4" fill="#ffffff" opacity="0.85" />
                  <!-- Golden Monocle Ring + Glint -->
                  <circle cx="0" cy="0" r="21" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-width="2.6" />
                  <path d="M 12 -14 A 18 18 0 0 1 17 -4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
                </g>
              </g>

              <!-- Lively Curved Dual-Fold White Newspaper (Tilted +3 deg opposite to head) -->
              <g transform="rotate(3 100 142)">
                <!-- Left Curved Page (Warm White #f8fafc) -->
                <path d="M 38 106 Q 68 104 100 116 L 100 170 Q 68 158 42 158 C 39 158 37 155 37 152 Z"
                      fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />
                <!-- Right Curved Page (Soft Shaded White #e2e8f0 for Fold Depth) -->
                <path d="M 162 106 Q 132 104 100 116 L 100 170 Q 132 158 158 158 C 161 158 163 155 163 152 Z"
                      fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />
                <!-- Center Spine Crease -->
                <line x1="100" y1="116" x2="100" y2="170" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

                <!-- Left Page: Bold Bullish Chart Breaking Out -->
                <polyline points="48,142 60,134 69,138 86,120"
                          fill="none" stroke="#f59e0b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="86" cy="120" r="3" fill="#f59e0b" />
                <line x1="48" y1="150" x2="84" y2="152" stroke="#94a3b8" stroke-width="2.6" stroke-linecap="round" />

                <!-- Right Page: Clean Financial Typography Bars -->
                <line x1="112" y1="126" x2="148" y2="121" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" />
                <line x1="112" y1="136" x2="148" y2="131" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
                <line x1="112" y1="145" x2="136" y2="142" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

                <!-- Asymmetric Cute Paws Gripping Paper (Left Higher, Right Lower) -->
                <rect x="29" y="116" width="15" height="22" rx="7.5" transform="rotate(-14 36 127)"
                      fill="#18181b" stroke="#fbbf24" stroke-width="2.4" />
                <rect x="155" y="124" width="15" height="22" rx="7.5" transform="rotate(12 162 135)"
                      fill="#18181b" stroke="#fbbf24" stroke-width="2.4" />
              </g>
  </g>
  <g transform="translate(176, 76)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="48" font-weight="800" fill="#18181b" letter-spacing="-1.5">Fin<tspan fill="#fbbf24">Bot</tspan></text>
    <text x="2" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#71717a" letter-spacing="1.5">PERSONAL EQUITY RESEARCH</text>
  </g>
</svg>
